name: CI Repair Agent tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps -w dist .
      - shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/ci_repair_agent-*.whl).FullName
          python -m pip install $wheel "pytest>=8,<10"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ci-repair --help
      - run: python -m pytest -q
