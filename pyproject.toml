[project]
name = "ci-repair-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1,<2",
    "langchain-google-genai>=4,<5",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
]

[project.scripts]
ci-repair = "ci_repair.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_repair"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8,<10"]
